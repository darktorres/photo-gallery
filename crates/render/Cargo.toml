[package]
name = "pg-render"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The display images: the thumbnails the grid shows (`maker`), and the viewer's images turned upright (`display`: the
# decode a view asks for, the fit, a video's poster, the ThumbHash placeholder). The codec decodes and encodes and the
# metadata reads the orientation; this crate passes it between them.
[dependencies]
anyhow.workspace = true
pg-codec = { path = "../codec" }
pg-metadata = { path = "../metadata" }
pg-model = { path = "../model" }
pg-video = { path = "../video" }
thiserror.workspace = true
thumbhash.workspace = true

[dev-dependencies]
pg-analysis = { path = "../analysis" }
pg-testkit = { path = "../testkit" }
