[package]
name = "pg-platform"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The operating system's calls behind portable functions: the directory listing, the file opens and their times, the
# thread priorities, the child processes, the clock, the message box, and the verbatim paths Win32 takes. Windows is
# the target; each function has a portable fallback so the library crates build on Unix too (the WSL checks).
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dependencies]
anyhow.workspace = true
pg-model = { path = "../model" }

[dev-dependencies]
pg-testkit = { path = "../testkit" }
