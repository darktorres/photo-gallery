[package]
name = "pg-exiftool"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The ExifTool driver: a `-stay_open` process for the writes that need its tags. The process is the platform's to
# start (no console window, ends with the driver).
[dependencies]
pg-platform = { path = "../platform" }
thiserror.workspace = true

[dev-dependencies]
pg-metadata = { path = "../metadata" }
pg-model = { path = "../model" }
# The image files the tests write (`pg_codec::fixtures`).
pg-codec = { path = "../codec", features = ["fixture"] }
pg-testkit = { path = "../testkit" }
# The test helpers of `pg_platform::testing`, which a test names directly.
pg-platform = { path = "../platform", features = ["testing"] }
