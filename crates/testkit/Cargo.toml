[package]
name = "pg-testkit"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Test helpers only (a dev-dependency of the crates that have tests), with no dependency on a crate of this workspace,
# so no crate's tests depend back on it through their own dependencies. Its dependencies are the encoders the fixtures
# use (`image`, `png`), and `anyhow` for the errors the helpers return. The job layer's helpers are `pg-jobs-testkit`.
[dependencies]
anyhow.workspace = true
image.workspace = true
png.workspace = true
