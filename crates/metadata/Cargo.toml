[package]
name = "pg-metadata"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The files' metadata: EXIF, XMP, the dates, and the patches that write a new orientation or rating into a file's
# bytes. Over bytes only: the caller reads and writes the files.
[dependencies]
pg-container = { path = "../container" }
pg-model = { path = "../model" }
miniz_oxide.workspace = true
quick-xml.workspace = true

[dev-dependencies]
# The APNG and GIF the tests read (`pg_codec::fixtures`).
pg-codec = { path = "../codec", features = ["fixture"] }
pg-testrng = { path = "../testrng" }
