[package]
name = "jpeg-decoders"
edition = "2024"
version = "0.1.0"
publish = false
description = "Speed and output of JPEG decoders on the library's kinds of files"

# Not a member of the app's workspace: the decoders compared here aren't the app's dependencies.
[workspace]

[dependencies]
anyhow = "1"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }
# Without rayon, so every decoder runs on one thread.
jpeg-decoder = { version = "0.3", default-features = false }
turbojpeg = { version = "1", features = ["cmake"] }
# The app's zune fork at the app's rev (the root Cargo.toml's [patch.crates-io] pins), the decoder the app uses.
zune-core = { git = "https://github.com/darktorres/zune-image", rev = "b4f668c817204c60f38e8416064902dea8a9441d" }
zune-jpeg = { git = "https://github.com/darktorres/zune-image", rev = "b4f668c817204c60f38e8416064902dea8a9441d" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = "0.20"

[[bench]]
name = "ir"
harness = false

[profile.release]
debug = "line-tables-only"

# The app's libjpeg-turbo build, and the app's zune-core: zune-jpeg (the fork) must use the same zune-core as the direct
# dependency above, or its ZCursor and reader traits are another crate's types and the decoder does not compile.
[patch.crates-io]
turbojpeg-sys = { git = "https://github.com/darktorres/rust-turbojpeg", rev = "28b8b86af795d5e6f1402c978e62facd61952da2" }
zune-core = { git = "https://github.com/darktorres/zune-image", rev = "b4f668c817204c60f38e8416064902dea8a9441d" }
