# The fuzz targets. Outside the workspace (its own `[workspace]`, so `cargo check --workspace` never builds
# libFuzzer): run with cargo-fuzz on Linux, `tools/fuzz_smoke.py` (`just fuzz-smoke`) or `cargo fuzz run <target>`.
# Each crash found becomes a regression test in the crate that owns the code, then the input is kept in corpus/.
[package]
name = "pg-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pg-codec = { path = "../crates/codec" }
pg-container = { path = "../crates/container" }
pg-edit = { path = "../crates/edit" }
pg-metadata = { path = "../crates/metadata" }
pg-model = { path = "../crates/model" }
serde_json = "1"

[workspace]
members = ["."]

[[bin]]
name = "container_jpeg"
path = "fuzz_targets/container_jpeg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "container_chunks"
path = "fuzz_targets/container_chunks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metadata_read"
path = "fuzz_targets/metadata_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit_rotate"
path = "fuzz_targets/edit_rotate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_keys"
path = "fuzz_targets/model_keys.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_query_json"
path = "fuzz_targets/model_query_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec_transform"
path = "fuzz_targets/codec_transform.rs"
test = false
doc = false
bench = false

# The workspace's vendored crates: the root Cargo.toml's [patch.crates-io] minus the four its graph never reaches
# (cxx-qt-build and qt-build-utils, which are Qt's, and rusqlite and thumbhash, which the catalog uses). Keep the rest
# in step with the root. Without these, this crate's graph would take the upstream quick-xml, which pg-metadata does not
# compile against. parajpeg is a git dependency of pg-codec, not a patch, so it is not listed here.
[patch.crates-io]
fast_image_resize = { git = "https://github.com/darktorres/fast_image_resize", rev = "32516f40454e1b227e24d7834cba5ca51076b921" }
fdeflate = { git = "https://github.com/darktorres/fdeflate", rev = "0994863ac0a3728982885e0b32521c1d88266820" }
gif = { git = "https://github.com/darktorres/image-gif", rev = "c79564c1cdf86e674b281f232aeffd706c325623" }
image-webp = { git = "https://github.com/darktorres/image-webp", rev = "1e9023c914f8f0793544a34b2c02525ff183863e" }
png = { git = "https://github.com/darktorres/image-png", rev = "2f176edb0a07b488d2b0236685f9ec184b91434e" }
quick-xml = { git = "https://github.com/darktorres/quick-xml", rev = "eb2fa71d72e974bbd9e7fa6723326a8933b62dbd" }
tiff = { git = "https://github.com/darktorres/image-tiff", rev = "7157618eaabddd2245223d5ec1899a624e005476" }
turbojpeg-sys = { git = "https://github.com/darktorres/rust-turbojpeg", rev = "28b8b86af795d5e6f1402c978e62facd61952da2" }
zune-core = { git = "https://github.com/darktorres/zune-image", rev = "b4f668c817204c60f38e8416064902dea8a9441d" }
zune-jpeg = { git = "https://github.com/darktorres/zune-image", rev = "b4f668c817204c60f38e8416064902dea8a9441d" }
