[package]
name = "pg-import"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The import pass: analyzes the files the scan found (their size, pixels, pairs, video) into the catalog. Depends on the analysis and the dedup, not on the thumbnails or the writes.
[dependencies]
pg-analysis = { path = "../analysis" }
pg-catalog = { path = "../catalog" }
pg-container = { path = "../container" }
pg-dedup = { path = "../dedup" }
pg-jobs = { path = "../jobs" }
pg-model = { path = "../model" }
pg-perf = { path = "../perf" }
pg-platform = { path = "../platform" }
anyhow.workspace = true

# The pairing probes (`examples/pairs_*_probe.rs`) read and write the catalog's pairing tables directly.
[dev-dependencies]
pg-testkit = { path = "../testkit" }
rusqlite.workspace = true
