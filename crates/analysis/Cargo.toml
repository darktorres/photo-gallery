[package]
name = "pg-analysis"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The import's analysis of a file: its record's hashes and ThumbHash, the border detector, and the PDQ hasher. The
# pixels come from the codec, the facts from the metadata and video readers.
[dependencies]
pg-codec = { path = "../codec" }
pg-metadata = { path = "../metadata" }
pg-model = { path = "../model" }
pg-video = { path = "../video" }
# The content hash of a video, streamed from its file (`file_hash_of`): the streaming reader is blake3's std feature.
blake3.workspace = true
thiserror.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
# The image files the tests write (`pg_codec::fixtures`).
pg-codec = { path = "../codec", features = ["fixture"] }
pg-testkit = { path = "../testkit" }
pg-testrng = { path = "../testrng" }
