[package]
name = "pg-desktop"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true


[lib]
# The unit tests run with Qt's bin on PATH (`just test` puts it there): a test binary links Qt and runs from
# target/<profile>/deps, where the Qt DLLs aren't, so without that PATH it fails with STATUS_DLL_NOT_FOUND.
doctest = false

[dependencies]
pg-client = { path = "../client" }
pg-catalog = { path = "../catalog" }
pg-thumbcache = { path = "../thumbcache" }
pg-model = { path = "../model" }
pg-platform = { path = "../platform" }
pg-trace = { path = "../trace" }
pg-yandex = { path = "../yandex" }
pg-library = { path = "../library" }
pg-jobs = { path = "../jobs" }
pg-app = { path = "../app" }
pg-render = { path = "../render" }
anyhow.workspace = true
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
cxx-qt-build = "0.10"
