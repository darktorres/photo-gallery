# CI (S-15). Three jobs: `windows` (the app: lint, tests, the QML tests, a deploy smoke test, the screenshot comparison),
# `linux` (the crates that build without Qt: clippy and tests, the wasm32 check, the supply-chain checks, the Python and
# Markdown lints), and `nightly` (the fuzz smoke test and the instruction-count gate).
#
# The steps run the Justfile's recipes and tools/ scripts, except the Linux job's cargo calls, which name the crates that
# build without Qt. The compiler is pinned in rust-toolchain.toml. Actions are pinned to commit SHAs with the tag in the
# comment; .github/dependabot.yml proposes updates. The Linux packages are in tools/profiling/apt-packages.txt.
#
# Inputs from outside the repository, and what each one is pinned to:
#   - Qt 6.12.0 (msvc2022_64), installed by jurplel/install-qt-action at C:\Qt\6.12.0\msvc2022_64 (the Justfile's path and
#     .cargo/config.toml's QMAKE).
#   - FFmpeg 9.0 shared build, GPL (BtbN autobuild-2026-10-30-13-01): FFMPEG_URL, checked against FFMPEG_SHA256 (GitHub's
#     digest of the release asset). FFMPEG_DIR is set from it, which overrides the Windows path in .cargo/config.toml.
#   - ExifTool (Chocolatey) at EXIFTOOL_VERSION, and the Linux packages in tools/profiling/apt-packages.txt.
#
# The screenshot comparison starts informational (continue-on-error) and becomes required once it is stable (plan S-15).
# The instruction-count gate is required, so a regression fails the nightly. It also needs the catalog benches' data
# (PG_BENCH_DATA, ~/pg-bench), which CI does not have yet, so that step is expected to fail until it does.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Scheduled runs have their own group: a nightly that runs for hours must not hold up the runs for pushes to main.
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.12.0"
  # The BtbN build named by the release tag, which is also the FFmpeg version the tests use (see the header).
  FFMPEG_URL: "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-30-13-01/ffmpeg-n9.0.2-39-g7adfbe40dc-win64-gpl-shared-9.0.zip"
  # The archive's SHA-256. A download that does not match fails the job, and the archive is not cached.
  FFMPEG_SHA256: "7c09a4c6bd73a5013963f06b1c6175326605cbc2585444ebe0f740ef4f35b4c9"
  # Pinned, so a new ExifTool release does not change the metadata tests unasked.
  EXIFTOOL_VERSION: "13.59.0"
  # A test that needs ExifTool or ffmpeg fails when it is missing, instead of skipping (pg_testkit::missing_tool).
  PG_REQUIRE_TOOLS: "1"

jobs:
  windows:
    name: Windows (app, Qt)
    if: github.event_name != 'schedule'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Lock file is current (nothing below may change it)
        shell: pwsh
        run: |
          cargo metadata --locked --format-version 1 > $null
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: just,cargo-deny,cargo-machete

      - name: "Qt ${{ env.QT_VERSION }} (at the path the Justfile names: C:/Qt/6.12.0/msvc2022_64)"
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VERSION }}
          # aqtinstall's latest release, 3.3.0, cannot install Qt 6.11 or later on Windows x64: Qt split that repository
          # by compiler, and 3.3.0 still looks for the old path (Updates.xml 404, "Failed to locate XML data"). Its master
          # can (issue miurahr/aqtinstall#959). Pinned to the commit wiRedPanda's CI uses for Qt 6.12 on Windows x64.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          arch: win64_msvc2022_64
          # The action installs to <dir>\Qt\<version>\<arch>, so dir is the drive root: C:\Qt\6.12.0\msvc2022_64.
          dir: C:\
          modules: qtmultimedia
          cache: true

      - name: FFmpeg archive (cached; keyed on the URL, which names the build)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}\ffmpeg.zip
          key: ffmpeg-${{ env.FFMPEG_URL }}

      - name: FFmpeg (shared build, for pg-video and its tests)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          if (-not (Test-Path $zip)) {
            Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $zip
          }
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) {
            # Removed, so the cache step does not save it.
            Remove-Item $zip
            throw "FFmpeg archive has SHA-256 $hash, expected $env:FFMPEG_SHA256"
          }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $root = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$root" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH

      - name: ExifTool (the metadata tests)
        shell: pwsh
        run: choco install exiftool --version=${{ env.EXIFTOOL_VERSION }} -y --no-progress

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Saved even when a step fails: lint and tests fail often while a change is being fixed, and what they compiled
          # is what the next run needs (the default saves nothing from a failed job).
          cache-on-failure: true
          # The workspace crates too: a change to one crate rebuilds it and its dependents, not the whole workspace.
          cache-workspace-crates: true

      - name: Lint (formatting, clippy, dependencies, Python, Markdown, QML)
        run: just lint

      - name: Tests (Qt's bin on PATH; PG_REQUIRE_TOOLS makes a missing tool fail the job)
        shell: pwsh
        run: |
          just test
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: QML tests
        run: just qmltest

      - name: Deploy smoke test (the release build with Qt's DLLs and QML modules)
        run: just deploy

      - name: Screenshot comparison against the PR's base
        if: github.event_name == 'pull_request'
        continue-on-error: true # informational until it is stable (plan S-15)
        shell: pwsh
        run: |
          # The base branch, which the comparison looks up by its commit. A shallow fetch: the checkout is one commit deep.
          git fetch --no-tags --depth=1 origin "+refs/heads/${env:GITHUB_BASE_REF}:refs/remotes/origin/${env:GITHUB_BASE_REF}"
          just shots -Base "origin/$env:GITHUB_BASE_REF"

      - name: Screenshot report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots
          path: |
            target/shots/report.txt
            target/shots/diff/
          if-no-files-found: ignore

  linux:
    name: Linux (crates without Qt)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Lock file is current (nothing below may change it)
        run: cargo metadata --locked --format-version 1 >/dev/null

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: just,cargo-deny,cargo-machete

      - name: Package list (tools/profiling/apt-packages.txt)
        id: apt
        run: echo "packages=$(grep -v '^#' tools/profiling/apt-packages.txt | xargs)" >> "$GITHUB_OUTPUT"

      - name: System packages (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ steps.apt.outputs.packages }}
          version: 1

      - name: gungraun-runner (cached; wsl-setup.sh builds it only when missing)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/gungraun-runner
          key: gungraun-runner-${{ hashFiles('Cargo.lock') }}

      - name: System libraries (FFmpeg, libclang, valgrind for the benches)
        run: bash tools/profiling/wsl-setup.sh

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Saved even when a step fails: lint and tests fail often while a change is being fixed, and what they compiled
          # is what the next run needs (the default saves nothing from a failed job).
          cache-on-failure: true
          # The workspace crates too: a change to one crate rebuilds it and its dependents, not the whole workspace.
          cache-workspace-crates: true
          # Off: this step runs after the gungraun-runner cache is restored, and rust-cache's save removes the binaries
          # it found in ~/.cargo/bin when it restored, which would take gungraun-runner out before its cache is saved.
          cache-bin: false

      - name: Build and test the crates that need no Qt
        run: |
          export FFMPEG_DIR="$HOME/.local/share/pg-bench/ffmpeg"
          LIBCLANG_PATH=$(find /usr/lib -maxdepth 2 -path '/usr/lib/llvm-*/lib' | sort -V | tail -1)
          export LIBCLANG_PATH
          cargo clippy --workspace --exclude pg-desktop --exclude pg-gallery --all-targets -- -D warnings
          cargo test --workspace --exclude pg-desktop --exclude pg-gallery

      - name: wasm32 (the shared model and the client stay free of platform code)
        run: cargo check -p pg-model -p pg-client --target wasm32-unknown-unknown

      - name: Supply chain (licences, advisories, unused dependencies)
        run: |
          cargo deny check
          cargo machete crates

      - name: Python and Markdown
        run: |
          # The versions the local tools run (the Justfile's lint uses whatever is installed); bump both together.
          python -m pip install --quiet ruff==0.17.3
          ruff format --check .
          ruff check .
          npm install --global markdownlint-cli@0.50.0
          markdownlint --ignore target --ignore .playwright-mcp --ignore vendor docs "**/README.md"

  nightly:
    name: Nightly (fuzz smoke, instruction counts)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Lock files are current (the root's and fuzz/'s)
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml >/dev/null

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: just

      # This is the first cache step, so its post step runs last: the gungraun-runner cache below is saved before
      # rust-cache removes the binaries it found when it restored. cache-bin stays on, which keeps cargo-fuzz (below).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Saved even when a step fails: lint and tests fail often while a change is being fixed, and what they compiled
          # is what the next run needs (the default saves nothing from a failed job).
          cache-on-failure: true
          # The workspace crates too: a change to one crate rebuilds it and its dependents, not the whole workspace.
          cache-workspace-crates: true
          # cargo-fuzz is installed with `cargo install` (fuzz-smoke.sh): keep it, so it isn't rebuilt each night.
          cache-all-crates: true
          # fuzz/ is its own workspace, so its build (the sanitizer builds) goes to fuzz/target, which is not cached by default.
          cache-directories: fuzz/target

      - name: Package list (tools/profiling/apt-packages.txt)
        id: apt
        run: echo "packages=$(grep -v '^#' tools/profiling/apt-packages.txt | xargs)" >> "$GITHUB_OUTPUT"

      - name: System packages (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ steps.apt.outputs.packages }}
          version: 1

      - name: gungraun-runner (cached; wsl-setup.sh builds it only when missing)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/gungraun-runner
          key: gungraun-runner-${{ hashFiles('Cargo.lock') }}

      - name: System libraries
        run: bash tools/profiling/wsl-setup.sh

      # The scripts build in a clone under $HOME by default, which rust-cache does not see, so each night compiled from
      # nothing. Pointing them at the checkout puts their builds where the cache keeps them. The checkout is at the
      # commit they test (both scripts reset their clone to HEAD).
      - name: Fuzz smoke test (60 s per target, S-18.3)
        env:
          PG_FUZZ_CLONE: ${{ github.workspace }}
        run: bash tools/fuzz-smoke.sh 60

      - name: Fuzz crashes (kept when the fuzz run fails)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

      - name: Instruction counts against the baseline (S-16.2, required)
        env:
          PG_BENCH_CLONE: ${{ github.workspace }}
        run: bash tools/perf-check.sh
