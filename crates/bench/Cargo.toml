[package]
name = "pg-bench"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The callgrind benches (benches/ir.rs): gungraun runs them under Valgrind, which is Linux-only (docs/PROFILING.md),
# so the benches are built there only; elsewhere the target is an empty program.
[dependencies]
pg-core = { path = "../core" }
rusqlite.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gungraun.workspace = true

[[bench]]
name = "ir"
harness = false
