[package]
name = "pg-gallery"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "gallery"
path = "src/main.rs"
# No unit tests here: a test binary would link Qt through the app and run from its build folder (target/<profile>/build/
# pg-gallery/<hash>/out under the pinned nightly), where the Qt DLLs aren't, and fail with STATUS_DLL_NOT_FOUND.
test = false

[dependencies]
# The app window: the program is the app.
pg-desktop = { path = "../desktop" }
# The dhat build's profiler settings (`PG_DHAT_UNTRIMMED`).
pg-platform = { path = "../platform" }
# The heap profiler: a patched dhat-rs that takes whole backtraces quickly
dhat = { workspace = true, optional = true }

[features]
# `gallery` with dhat as its allocator, writing dhat-heap.json when it ends. Built with the `dhat` profile.
dhat-heap = ["dep:dhat"]

[build-dependencies]
winres.workspace = true
