# Tests may panic: a failed assertion is a panic, and the panic lint (Cargo.toml) is for the code that ships.
allow-panic-in-tests = true
# Tests may print: a skipped test says so, and a test reports its counts. The print lints (Cargo.toml) are for the code that ships.
allow-print-in-tests = true
# Test code is exempt from the panic-freedom lints; the production code is held to them.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true

# std's hash maps are randomly seeded, so iterating one gives a different order on every run, and anything that
# order reaches (a report, a list, a test) changes with it. Use BTreeMap/BTreeSet; if hashing is ever needed for
# speed, a fixed-seed hasher.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "randomly seeded; use BTreeMap (or a fixed-seed hasher)" },
    { path = "std::collections::HashSet", reason = "randomly seeded; use BTreeSet (or a fixed-seed hasher)" },
    { path = "std::hash::RandomState", reason = "randomly seeded" },
]

# Test scratch goes through pg_testkit::run_folder, which owns its folder (pg-platform's testing module). The one read of
# the temp folder is there, with its expect; any other use would make a folder no cleanup owns.
# A path as typed is not the catalog's spelling of a folder (real case and 8.3 names are not resolved), and a comparison
# of a typed path with the catalog's paths fails for another spelling of the same folder. The catalog's spelling is
# pg_platform::names::normalize_path; a call of the typed one says why it is the path it means (an #[expect] at the call).
disallowed-methods = [
    { path = "std::env::temp_dir", reason = "test scratch goes through pg_testkit::run_folder, which owns its folders" },
    { path = "pg_platform::names::rule_path_in", reason = "the path as typed, not as the catalog spells it: use normalize_path" },
    { path = "pg_platform::names::rule_path_of", reason = "the path as typed, not as the catalog spells it: use normalize_path" },
]
