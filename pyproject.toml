# The repository's Python environments, managed by uv (`uv sync --group <name>`, `uv run`). The Rust and Qt side is not here:
# it is built by cargo, and its native kits (Qt, FFmpeg, CUDA) are pinned in the Justfile.
[project]
name = "photo-gallery"
version = "0.0.0"
requires-python = "==3.12.*"

[tool.uv]
# A set of scripts and tools, not an installable package.
package = false
# What `uv sync` and `uv run` install by default. The GPU groups (eval, jpeg-decoders) are added with `--group` when needed:
# a `uv run` without them removes them from the environment.
default-groups = ["tools", "lint"]
# The lock covers the platforms the scripts run on: Windows (this machine) and Linux (the container and CI).
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

# The PyTorch CUDA wheels and the NVIDIA TensorRT wheels come from their own indexes. Each is `explicit`, so only the
# packages assigned to it below are looked up there; everything else resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu134" }
torchvision = { index = "pytorch-cu134" }
tensorrt_cu13 = { index = "nvidia" }
tensorrt_cu13_bindings = { index = "nvidia" }
tensorrt_cu13_libs = { index = "nvidia" }

[dependency-groups]
# The test and tool scripts (tools/shots, tools/profiling). Standard-library unittest needs nothing more.
tools = [
    "numpy==2.5.5",
    "pillow==13.0.0",
]
# The lint's Python tool, at CI's pin (tools/lint/requirements.txt, with hashes in uv.lock).
lint = [
    "ruff==0.17.5",
]
# The JPEG decoder harness (eval/jpeg-decoders/requirements.txt).
jpeg-decoders = [
    "numpy==2.5.5",
    "nvidia-libnvcomp-cu13==6.0.0.12",
    "nvidia-nvimgcodec-cu13==0.10.0.9",
    "nvidia-nvjpeg==13.3.2.43",
    "nvidia-nvjpeg2k-cu13==0.12.0.58",
    "nvidia-nvtiff-cu13==0.9.0.86",
    "pillow==13.0.0",
]
# The GPU eval stack (eval/requirements.txt): torch, TensorRT, and the rest of the model and image libraries.
