[package]
name = "pg-thumbs"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The thumbnail pass: makes the cached thumbnails of the analyzed files. Its normal dependencies are the render and the thumbnail cache, not the analysis or the writes.
[dependencies]
pg-catalog = { path = "../catalog" }
pg-jobs = { path = "../jobs" }
pg-model = { path = "../model" }
pg-perf = { path = "../perf" }
pg-platform = { path = "../platform" }
pg-render = { path = "../render" }
pg-thumbcache = { path = "../thumbcache" }
thiserror.workspace = true

[dev-dependencies]
# The cache's refusal of its stores, for the tests that a store's error ends the pass with its failure written (`fault`).
pg-thumbcache = { path = "../thumbcache", features = ["fault"] }
# The catalog's test fixture (files as the scanner inserts them).
pg-catalog = { path = "../catalog", features = ["fixture"] }
# The analysis and the import, which the tests run before the passes (the pass itself does not depend on them).
pg-analysis = { path = "../analysis" }
pg-import = { path = "../import" }
pg-scan = { path = "../scan" }
pg-testkit = { path = "../testkit" }
pg-jobs-testkit = { path = "../jobs-testkit" }
# The image files the tests write (`pg_codec::fixtures`).
pg-codec = { path = "../codec", features = ["fixture"] }
