[package]
name = "pg-desktop"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true


[lib]
# No unit tests here (the UI is checked through its test hooks, crates/README.md). A test binary would still link Qt
# and run from target/<profile>/deps, where the Qt DLLs aren't, and fail with STATUS_DLL_NOT_FOUND.
test = false
doctest = false

[dependencies]
pg-codec = { path = "../codec" }
pg-client = { path = "../client" }
pg-catalog = { path = "../catalog" }
pg-thumbcache = { path = "../thumbcache" }
pg-model = { path = "../model" }
pg-platform = { path = "../platform" }
pg-trace = { path = "../trace" }
pg-yandex = { path = "../yandex" }
pg-library = { path = "../library" }
pg-jobs = { path = "../jobs" }
pg-app = { path = "../app" }
anyhow.workspace = true
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
cxx-qt-build = "0.10"
