[package]
name = "pg-edit"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The lossless edits: a rotation or a crop that rewrites a file's bytes. The pixel encoders are the codec's; the
# container's and the metadata's parsers read the file, and the tests take their fixtures from pg-testkit.
[dependencies]
pg-codec = { path = "../codec" }
pg-container = { path = "../container" }
pg-metadata = { path = "../metadata" }
pg-model = { path = "../model" }
image-webp.workspace = true
thiserror.workspace = true
png.workspace = true
turbojpeg.workspace = true
weezl.workspace = true

[dev-dependencies]
# The codec's test helpers that take its types (`fixtures::tiff_rgb8`, `webp_lossy_rgb`, `orient`); the other images
# come from pg-testkit.
pg-codec = { path = "../codec", features = ["fixture"] }
# The tests decode a file the way the viewer shows it (`pg_render::display`).
pg-render = { path = "../render" }
pg-testkit = { path = "../testkit" }
