# `cargo deny --config eval/deny.toml` for the eval workspaces (eval/jpeg-decoders, eval/png-decoders; `just deny`). It is the
# root deny.toml, with the entries marked `eval` (the decoder-comparison harnesses' wrappers and licenses) that the root
# must not carry: the root's own graph never reaches them, so the root would report them unused. Keep the rest in step
# with the root file.

# `cargo deny check` (just lint): advisories, licenses, duplicate versions and where crates come from.

[graph]
# Optional dependencies count too (specta in pg-model, dhat and pg-desktop in gallery): the advisory, license and ban
# checks see every feature the workspace can build.
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# What the dependencies use today; a new license is a decision, not an accident.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    # libloading, pg-video's run-time loader of FFmpeg (and bindgen's, in its build script).
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# A license that exactly one crate uses is a per-crate exception, so a new crate under it is a decision, not a default.
# webpki-root-certs, the CA bundle that ureq's native-tls feature pulls in (the Yandex client). Its license covers the
# certificate data, not code.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]
# xxhash-rust, the xxh3 hash pg-analysis uses (crates/analysis/src/analyze.rs).
[[licenses.exceptions]]
crate = "xxhash-rust"
allow = ["BSL-1.0"]
# Inflector, the case conversion of specta's derive (pg-model's optional `specta` feature, reached now that the graph
# includes every feature).
[[licenses.exceptions]]
crate = "Inflector"
allow = ["BSD-2-Clause"]
# libfuzzer-sys, the fuzz harness's driver (the fuzz workspace only, `fuzz/Cargo.toml`): its code is the LLVM libFuzzer
# runtime, under the University of Illinois/NCSA license (an OSI-approved permissive license).
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]
# eval: ffmpeg-next and ffmpeg-sys-next, the FFmpeg bindings of the eval harness (eval/jpeg-decoders, which compares decoders
# against FFmpeg). Their license is WTFPL, an unrestricted permissive license; the crates are never in the shipped graph.
[[licenses.exceptions]]
crate = "ffmpeg-next"
allow = ["WTFPL"]
[[licenses.exceptions]]
crate = "ffmpeg-sys-next"
allow = ["WTFPL"]

# Our own crates are `publish = false` and carry no license field.
[licenses.private]
ignore = true

[bans]
# Reported, not fatal. The duplicates left are build tools and mixed-version dependencies (cxx-qt-gen, codespan-reporting,
# libloading 0.8/0.9, syn 2/3, thiserror 1/2, miniz_oxide 0.8/0.9, unicode-width, weezl 0.1/0.2). They stay `warn` on
# purpose: a `deny` with a `[[bans.skip]]` per duplicate is the end state, but it is adopted after the forks are retired,
# since retiring a fork changes which duplicates exist (ALLOWLIST_PLAN.md, Phase B step 6).
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# The libraries have no UI dependency: Qt and its bindings come in through pg-desktop only.
deny = [
    { crate = "cxx-qt", wrappers = ["pg-desktop", "cxx-qt-lib"] },
    { crate = "cxx-qt-lib", wrappers = ["pg-desktop"] },
    # The file metadata (pg-metadata) is the only XML parser.
    # miniz_oxide and crc32fast aren't banned: png, tiff and flate2 depend on them too.
    { crate = "quick-xml", wrappers = ["pg-metadata"] },
    # The image decoders and encoders are pg-codec's, its test fixtures (the `fixture` feature) included. `image` is the
    # door to the rest, so its parents are these crates.
    { crate = "image", wrappers = ["pg-codec"] },
    # eval: the decoder-comparison harnesses name the decoders directly.
    { crate = "turbojpeg", wrappers = ["pg-codec", "jpeg-decoders"] },
    { crate = "png", wrappers = ["pg-codec", "image", "png-decoders"] },
    { crate = "gif", wrappers = ["pg-codec", "image"] },
    { crate = "image-webp", wrappers = ["pg-codec", "image"] },
    # libwebp, the lossy WebP encoder and decoder: pg-codec's alone.
    { crate = "webp", wrappers = ["pg-codec"] },
    { crate = "libwebp-sys", wrappers = ["webp"] },
    { crate = "tiff", wrappers = ["pg-codec", "image"] },
    # eval: the decoders are compared in eval/jpeg-decoders and eval/png-decoders (workspaces that are not shipped).
    { crate = "zune-jpeg", wrappers = ["pg-codec", "image", "tiff", "jpeg-decoders"] },
    { crate = "zune-core", wrappers = ["pg-codec", "image", "zune-jpeg", "jpeg-decoders", "zune-png", "png-decoders"] },
    # SQLite is the owners' alone: pg-catalog's, pg-dbfile's (the shared file lifecycle, and the copies a bench opens in
    # WAL), pg-thumbcache's (its own file and its test-only fault trigger), and pg-query's (it registers the SQL
    # functions on a connection). Other crates reach a database through these.
    { crate = "rusqlite", wrappers = ["pg-catalog", "pg-query", "pg-dbfile", "pg-thumbcache"] },
    # ureq (the HTTP client) is pg-yandex's alone: the search and the downloads.
    { crate = "ureq", wrappers = ["pg-yandex"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The patched crates, pinned by rev from our forks. Each fork is ours, carrying the upstream's code.
allow-git = [
    "https://github.com/darktorres/fast_image_resize",
    "https://github.com/darktorres/fdeflate",
    "https://github.com/darktorres/image-gif",
    "https://github.com/darktorres/image-webp",
    "https://github.com/darktorres/image-png",
    "https://github.com/darktorres/cxx-qt",
    "https://github.com/darktorres/quick-xml",
    "https://github.com/darktorres/parajpeg",
    "https://github.com/darktorres/rusqlite",
    "https://github.com/darktorres/thumbhash",
    "https://github.com/darktorres/image-tiff",
    "https://github.com/darktorres/rust-turbojpeg",
    "https://github.com/darktorres/zune-image",
    "https://github.com/darktorres/dhat-rs",
]
