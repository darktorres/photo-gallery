# Lint config for the Python scripts (eval/, tools/). Run by `just lint`.
target-version = "py312"
line-length = 130
src = ["eval", "tools"]  # their modules import each other as first-party (from common import ...)
# docs/research holds verbatim copies of upstream files (notebooks, pages); they are kept as saved, not linted.
extend-exclude = ["docs/research"]

[lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF", "PLE", "PLW",
    "A",     # builtins shadowed by names
    "ARG",   # unused function arguments
    "ASYNC", # blocking calls inside async code
    "BLE",   # blind `except Exception`
    "DTZ",   # naive datetimes
    "ERA",   # commented-out code
    "FURB",  # modernised idioms
    "G",     # logging calls
    "ISC",   # implicit string concatenation
    "LOG",   # logging misuse
    "N",     # pep8-naming
    "NPY",   # numpy pitfalls
    "PERF",  # performance anti-patterns
    "PGH",   # blanket `# type: ignore` / `# noqa`
    "PLC",   # pylint conventions
    "PTH",   # os.path -> pathlib
    "RET",   # return-statement clarity
    "RSE",   # raise syntax
    "S",     # bandit security checks
    "SLF",   # private member access
    "TCH",   # imports only needed for type checking
    "TRY",   # exception-handling hygiene
]
ignore = [
    "TRY003",  # long messages in exceptions are fine in scripts; the message is what gets read
    "S603",    # the tools shell out to git, ffmpeg and the build; their arguments are our own
    "S607",    # same: tools are resolved from PATH on purpose
]

# Each per-file ignore names its files and its reason; a rule that a file stops needing fails nothing, so review these
# when a file changes.
[lint.per-file-ignores]
# eval/ is the benchmark and verify harness: its optional GPU and codec packages are imported inside the functions that
# need them (PLC0415), its asserts are its checks (S101), its synthetic data uses `random` (S311), it keeps the upstream
# short names (N812), and it prints the typographic characters of its tables (RUF001).
"eval/**" = ["N812", "PLC0415", "RUF001", "S101", "S311"]
# Test modules and the Docker check: an assert is the check.
"docker/check.py" = ["S101"]
"tools/test_ci_files.py" = ["S101"]
"tools/test_merge_measure.py" = ["S101"]
# Synthetic benchmark data: `random` is not a secret.
"tools/profiling/synthetic_library.py" = ["S311"]
"tools/profiling/pairing/grow_catalog.py" = ["S311"]
# Imports inside the function that uses them: an optional dependency or a path only one command takes.
"tools/check_feature_coverage.py" = ["PLC0415"]
"tools/test_check_feature_coverage.py" = ["PLC0415"]
"tools/ci/github_files.py" = ["PLC0415"]
"tools/compare_shots.py" = ["PLC0415"]
"tools/merge_measure.py" = ["PLC0415"]
"tools/profiling/callgraph/build.py" = ["PLC0415"]
"tools/profiling/callgraph/symbolize.py" = ["PLC0415"]
