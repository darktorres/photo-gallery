# `cargo deny check` (just lint): advisories, licenses, duplicate versions and where crates come from.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Test-only: pdqhash 0.1.1 (the latest), the reference PDQ pg-core's tests compare against, pulls in image 0.23.
    { id = "RUSTSEC-2025-0056", reason = "adler, unmaintained; dev-dependency only, via pdqhash 0.1.1 (latest)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# What the dependencies use today; a new license is a decision, not an accident.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # libloading, under bindgen (ffmpeg-sys-next's build script only, not in the binaries). MIT-like.
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    # ffmpeg-next and ffmpeg-sys-next, the FFmpeg bindings (videos). FFmpeg itself is LGPL, linked as DLLs.
    "WTFPL",
    "Zlib",
]

# Our own crates are `publish = false` and carry no license field.
[licenses.private]
ignore = true

[bans]
# Reported, not fatal: most come from pdqhash's old image 0.23 (test-only) and cxx-qt's build tools.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# pg-core has no UI dependency (PLAN §7): Qt and its bindings come in through pg-desktop only.
deny = [
    { crate = "cxx-qt", wrappers = ["pg-desktop", "cxx-qt-lib"] },
    { crate = "cxx-qt-lib", wrappers = ["pg-desktop"] },
    # The file metadata (pg-metadata) is the only XML parser. pg-core stays a wrapper until its code moves (S-05, S-09).
    # miniz_oxide and crc32fast aren't banned: png, tiff and flate2 depend on them too.
    { crate = "quick-xml", wrappers = ["pg-metadata", "pg-core"] },
    # The image decoders and encoders are pg-codec's, and the test fixtures' (pg-testkit). `image` is the door to the
    # rest, so its parents are these crates; pg-core and pg-ingest keep their tests' fixtures until S-05.4, S-05.5 and
    # S-09 move them. turbojpeg also serves pg-core's maker and rewriter until S-05.4, S-05.5 and S-06.3.
    { crate = "image", wrappers = ["pg-codec", "pg-testkit", "pg-core", "pg-ingest", "pdqhash"] },
    { crate = "turbojpeg", wrappers = ["pg-codec", "pg-edit", "pg-core"] },
    { crate = "png", wrappers = ["pg-codec", "pg-testkit", "pg-edit", "image", "pg-core"] },
    { crate = "gif", wrappers = ["pg-codec", "pg-testkit", "image", "pg-core"] },
    { crate = "image-webp", wrappers = ["pg-codec", "pg-edit", "image", "pg-core"] },
    { crate = "tiff", wrappers = ["pg-codec", "pg-testkit", "image", "pg-core"] },
    { crate = "zune-jpeg", wrappers = ["pg-codec", "image", "tiff", "pg-core"] },
    { crate = "zune-core", wrappers = ["pg-codec", "image", "zune-jpeg", "pg-core"] },
    # FFmpeg is linked by pg-video alone: a video's probe, frames and file hash.
    { crate = "ffmpeg-next", wrappers = ["pg-video"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
