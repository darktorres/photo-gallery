[package]
name = "pg-platform"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The operating system's calls behind portable functions: the directory listing, the file opens and their times, the
# thread priorities, the child processes, the clock, the message box, and the verbatim paths Win32 takes. Windows is
# the target; each function has a portable fallback so the library crates build on Unix too (the Linux checks).
[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dependencies]
pg-model = { path = "../model" }
libloading.workspace = true

# The test folders and their helpers (`testing`), for pg-testkit: a production build does not compile them. Its own tests
# compile them under `cfg(test)`.
[features]
testing = []
