[package]
name = "pg-ui"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The code cxx-qt's bridges expand to names `cxx` directly.
[package.metadata.cargo-machete]
ignored = ["cxx"]

[[bin]]
name = "gallery"
path = "src/main.rs"

[dependencies]
pg-core = { path = "../core" }
pg-ingest = { path = "../ingest" }
anyhow.workspace = true
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde.workspace = true
serde_json.workspace = true
thumbhash.workspace = true
turbojpeg.workspace = true
windows-sys.workspace = true

[build-dependencies]
cxx-qt-build = "0.10"
