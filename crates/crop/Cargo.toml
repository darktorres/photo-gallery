[package]
name = "pg-crop"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The pass that saves cropped copies of the borders the catalog has: it cuts them (`pg-edit`), copies the metadata
# (`pg-exiftool`) and checks each original is unchanged (`pg_platform::file::stat`); the copies' folders are compared
# in their real form (`pg_platform::names::normalize_path`).
# Its tests that need a catalog are `pg-library`'s (they prepare one with `pg_library::versions`).
[dependencies]
pg-catalog = { path = "../catalog" }
pg-edit = { path = "../edit" }
pg-exiftool = { path = "../exiftool" }
pg-jobs = { path = "../jobs" }
pg-model = { path = "../model" }
pg-platform = { path = "../platform" }
anyhow.workspace = true

[dev-dependencies]
pg-testkit = { path = "../testkit" }
