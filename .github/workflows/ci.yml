# CI (S-15). Three jobs: `windows` (the app: lint, tests, the QML tests, a deploy smoke test, the screenshot comparison),
# `linux` (the crates that build without Qt: tests, the wasm32 check, the supply-chain checks), and `nightly` (the fuzz
# smoke test and the instruction-count gate). Every command is one the Justfile or tools/ has, so a failure here
# reproduces locally.
#
# Not verified: this file was written without running it on a runner. The first run is the check. Two things it needs
# from outside the repository:
#   - Qt 6.12.0 (msvc2022_64), installed at C:\Qt (the Justfile's path, .cargo/config.toml's QMAKE).
#   - FFmpeg 9.0 shared build, GPL (BtbN autobuild-2026-10-30-13-01), downloaded from the URL in FFMPEG_URL below.
#     FFMPEG_DIR is set from it, which overrides the Windows path in .cargo/config.toml.
# The screenshot comparison starts informational (continue-on-error) and becomes required once it is stable (plan S-15).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.12.0"
  # The BtbN build named by the release tag, which is also the FFmpeg version the tests use (see the header).
  FFMPEG_URL: "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-30-13-01/ffmpeg-n9.0.2-39-g7adfbe40dc-win64-gpl-shared-9.0.zip"
  # A test that needs ExifTool or ffmpeg fails when it is missing, instead of skipping (pg_testkit::missing_tool).
  PG_REQUIRE_TOOLS: "1"

jobs:
  windows:
    name: Windows (app, Qt)
    if: github.event_name != 'schedule'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the screenshot comparison builds the PR's base commit

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,cargo-machete

      - name: "Qt ${{ env.QT_VERSION }} (at the path the Justfile names: C:/Qt/6.12.0/msvc2022_64)"
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # aqtinstall's latest release, 3.3.0, cannot install Qt 6.11 or later on Windows x64: Qt split that repository
          # by compiler, and 3.3.0 still looks for the old path (Updates.xml 404, "Failed to locate XML data"). Its master
          # can (issue miurahr/aqtinstall#959). Pinned to the commit wiRedPanda's CI uses for Qt 6.12 on Windows x64.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          arch: win64_msvc2022_64
          # The action installs to <dir>\Qt\<version>\<arch>, so dir is the drive root: C:\Qt\6.12.0\msvc2022_64.
          dir: C:\
          modules: qtmultimedia
          cache: true

      - name: FFmpeg archive (cached; keyed on the URL, which names the build)
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\ffmpeg.zip
          key: ffmpeg-${{ env.FFMPEG_URL }}

      - name: FFmpeg (shared build, for pg-video and its tests)
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP\ffmpeg.zip")) {
            Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          }
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $root = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$root" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH

      - name: ExifTool (the metadata tests)
        shell: pwsh
        run: choco install exiftool -y --no-progress

      - uses: Swatinem/rust-cache@v2
        with:
          # Saved even when a step fails: lint and tests fail often while a change is being fixed, and what they compiled
          # is what the next run needs (the default saves nothing from a failed job).
          cache-on-failure: true
          # The workspace crates too: a change to one crate rebuilds it and its dependents, not the whole workspace.
          cache-workspace-crates: true

      - name: Lint (formatting, clippy, dependencies, Python, Markdown, QML)
        run: just lint

      - name: Tests (Qt's bin on PATH; PG_REQUIRE_TOOLS makes a missing tool fail the job)
        shell: pwsh
        run: |
          just test
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: QML tests
        run: just qmltest

      - name: Deploy smoke test (the release build with Qt's DLLs and QML modules)
        run: just deploy

      - name: Screenshot comparison against the PR's base
        if: github.event_name == 'pull_request'
        continue-on-error: true # informational until it is stable (plan S-15)
        shell: pwsh
        run: just shots -Base "origin/$env:GITHUB_BASE_REF"

      - name: Screenshot report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            target/shots/report.txt
            target/shots/diff/
          if-no-files-found: ignore

  linux:
    name: Linux (crates without Qt)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,cargo-machete

      # The package list repeats the apt line in tools/profiling/wsl-setup.sh; the script still installs anything missing.
      - name: System packages (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: valgrind build-essential cmake nasm clang libclang-dev pkg-config git libssl-dev python3 ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev libimage-exiftool-perl
          version: 1

      - name: gungraun-runner (cached; wsl-setup.sh builds it only when missing)
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/gungraun-runner
          key: gungraun-runner-${{ hashFiles('Cargo.lock') }}

      - name: System libraries (FFmpeg, libclang, valgrind for the benches)
        run: bash tools/profiling/wsl-setup.sh

      - name: ExifTool and ffmpeg (the metadata and video tests)
        run: sudo apt-get install -y -qq libimage-exiftool-perl ffmpeg

      - uses: Swatinem/rust-cache@v2
        with:
          # Saved even when a step fails: lint and tests fail often while a change is being fixed, and what they compiled
          # is what the next run needs (the default saves nothing from a failed job).
          cache-on-failure: true
          # The workspace crates too: a change to one crate rebuilds it and its dependents, not the whole workspace.
          cache-workspace-crates: true

      - name: Build and test the crates that need no Qt
        env:
          FFMPEG_DIR: /home/runner/.local/share/pg-bench/ffmpeg
        run: |
          LIBCLANG_PATH=$(find /usr/lib -maxdepth 2 -path '/usr/lib/llvm-*/lib' | sort -V | tail -1)
          export LIBCLANG_PATH
          cargo clippy --workspace --exclude pg-desktop --exclude pg-gallery --all-targets -- -D warnings
          cargo test --workspace --exclude pg-desktop --exclude pg-gallery

      - name: wasm32 (the shared model and the client stay free of platform code)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p pg-model -p pg-client --target wasm32-unknown-unknown

      - name: Supply chain (licences, advisories, unused dependencies)
        run: |
          cargo deny check
          cargo machete crates

      - name: Python and Markdown
        run: |
          # The versions the local tools run (the Justfile's lint uses whatever is installed); bump both together.
          python -m pip install --quiet ruff==0.17.3
          ruff format --check .
          ruff check .
          npm install --global markdownlint-cli@0.50.0
          markdownlint --ignore target --ignore .playwright-mcp --ignore vendor docs "**/README.md"

  nightly:
    name: Nightly (fuzz smoke, instruction counts)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: Swatinem/rust-cache@v2
        with:
          # Saved even when a step fails: lint and tests fail often while a change is being fixed, and what they compiled
          # is what the next run needs (the default saves nothing from a failed job).
          cache-on-failure: true
          # The workspace crates too: a change to one crate rebuilds it and its dependents, not the whole workspace.
          cache-workspace-crates: true
          # cargo-fuzz is installed with `cargo install` (fuzz-smoke.sh): keep it, so it isn't rebuilt each night.
          cache-all-crates: true
          # fuzz/ is its own workspace, so its build (the sanitizer builds) goes to fuzz/target, which is not cached by default.
          cache-directories: fuzz/target

      # Same package list as the linux job (keep the two in sync, and with tools/profiling/wsl-setup.sh).
      - name: System packages (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: valgrind build-essential cmake nasm clang libclang-dev pkg-config git libssl-dev python3 ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev libimage-exiftool-perl
          version: 1

      - name: gungraun-runner (cached; wsl-setup.sh builds it only when missing)
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/gungraun-runner
          key: gungraun-runner-${{ hashFiles('Cargo.lock') }}

      - name: System libraries
        run: bash tools/profiling/wsl-setup.sh

      # The scripts build in a clone under $HOME by default, which rust-cache does not see, so each night compiled from
      # nothing. Pointing them at the checkout puts their builds where the cache keeps them. The checkout is at the
      # commit they test (both scripts reset their clone to HEAD).
      - name: Fuzz smoke test (60 s per target, S-18.3)
        env:
          PG_FUZZ_CLONE: ${{ github.workspace }}
        run: bash tools/fuzz-smoke.sh 60

      - name: Instruction counts against the baseline (S-16.2; informational until the baseline is measured)
        continue-on-error: true
        env:
          PG_BENCH_CLONE: ${{ github.workspace }}
        run: bash tools/perf-check.sh
