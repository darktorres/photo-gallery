# CI (S-15). Two jobs: `windows` (the app: lint, tests, the QML tests, the screenshot comparison),
# and `linux` (the whole workspace, Qt 6.12 for Linux included: formatting, clippy, tests, docs, the wasm32 check, the
# supply-chain checks, the Python and Markdown lints). The Linux job runs cargo directly, where the Windows job runs the
# Justfile's recipes: the Justfile's recipes are Windows-first (QT_DIR, PowerShell). The compiler is pinned in
# rust-toolchain.toml. Actions are pinned to commit SHAs with the tag in the
# comment; .github/dependabot.yml proposes updates. The Linux packages are in tools/profiling/apt-packages.txt.
#
# Inputs from outside the repository, and what each one is pinned to:
#   - Qt 6.12.0 (msvc2022_64), installed by jurplel/install-qt-action at C:\Qt\6.12.0\msvc2022_64. The Windows job sets
#     QT_DIR to that folder, as a developer's .env does.
#   - FFmpeg 9.0 shared build, GPL (BtbN autobuild-2026-10-30-13-01): pinned in the Justfile, which `just setup` fetches and
#     checks against its SHA-256 (GitHub's digest of the release asset). The Windows job runs that recipe.
#   - ExifTool (Chocolatey) at EXIFTOOL_VERSION, and the Linux packages in tools/profiling/apt-packages.txt.
#
# The screenshot comparison starts informational (continue-on-error) and becomes required once it is stable (plan S-15).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Cargo draws its progress bar only on a terminal; the runner has none, so force it, at a fixed width.
  CARGO_TERM_PROGRESS_WHEN: always
  CARGO_TERM_PROGRESS_WIDTH: "100"
  # Path packages (the workspace and the [patch] path crates) are compared by checksum, not mtime, so a fresh checkout does
  # not rebuild them. The flag alone changes nothing: cargo also needs build.fingerprint = "content". Local builds do not
  # set these. Both are unstable cargo settings, accepted by the pinned nightly (rust-toolchain.toml) without RUSTC_BOOTSTRAP.
  # A build script's rerun-if-changed lines compare mtimes, which a fresh checkout makes new. pg-desktop avoids that with a
  # content key (PG_DESKTOP_CONTENT_KEY, set by the step after the toolchain: a hash of crates/desktop, see its build.rs).
  # pg-video's FFmpeg folder is cached with its archive, so it keeps the old mtimes (the FFmpeg cache step). On Linux, where
  # apt installs the headers on every run, PG_VIDEO_CONTENT_KEY (a hash of the packages, set by the build environment step)
  # does the same job. The flag below
  # covers rustdoc: it uses the dep-info file instead of the newest source mtime.
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
  CARGO_BUILD_FINGERPRINT: "content"
  CARGO_UNSTABLE_RUSTDOC_DEPINFO: "true"
  QT_VERSION: "6.12.0"
  # Pinned, so a new ExifTool release does not change the metadata tests unasked.
  EXIFTOOL_VERSION: "13.59.0"
  # A test that needs ExifTool or ffmpeg fails when it is missing, instead of skipping (pg_testkit::missing_tool).
  PG_REQUIRE_TOOLS: "1"

jobs:
  windows:
    name: Windows (app, Qt)
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      # Diagnostic (temporary): why cargo rebuilds each unit. Each rebuilt unit logs "dirty:" with its reason.
      CARGO_LOG: cargo::compiler::fingerprint=info
      # The Qt kit installed below: where the Justfile's recipes and the desktop crate find qmake (a developer sets it in .env).
      QT_DIR: 'C:\Qt\6.12.0\msvc2022_64'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Content key for pg-desktop's build script (a hash of its crate; see crates/desktop/build.rs)
        shell: pwsh
        run: '"PG_DESKTOP_CONTENT_KEY=${{ hashFiles(''crates/desktop/**'') }}" >> $env:GITHUB_ENV'

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          # Pinned: a new release of these can change what the lint reports. `just lint` checks the same versions.
          tool: just@1.59.0

      - name: "Qt ${{ env.QT_VERSION }} (at QT_DIR, C:\\Qt\\6.12.0\\msvc2022_64)"
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VERSION }}
          # aqtinstall's latest release, 3.3.0, cannot install Qt 6.11 or later on Windows x64: Qt split that repository
          # by compiler, and 3.3.0 still looks for the old path (Updates.xml 404, "Failed to locate XML data"). Its master
          # can (issue miurahr/aqtinstall#959). Pinned to the commit wiRedPanda's CI uses for Qt 6.12 on Windows x64.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          arch: win64_msvc2022_64
          # The action installs to <dir>\Qt\<version>\<arch>, so dir is the drive root: C:\Qt\6.12.0\msvc2022_64.
          dir: C:\
          modules: qtmultimedia
          cache: true

      - name: FFmpeg archive and build (cached; keyed on the Justfile, which holds the pin)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # The extracted build too: pg-video's build script reruns when its include folder is newer than its last run, and
          # an extraction on every run made it newer every time. A restore keeps the files' times.
          path: |
            .deps/downloads
            .deps/ffmpeg
          key: ffmpeg-${{ hashFiles('Justfile') }}

      - name: FFmpeg (the pinned shared build, for pg-video and its tests)
        shell: pwsh
        run: |
          # `just setup` checks the archive against the pin before it unpacks anything, so a mismatch fails here and nothing
          # bad reaches the cache. With the build already there, it does nothing.
          just setup
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "$env:GITHUB_WORKSPACE\.deps\ffmpeg\bin" >> $env:GITHUB_PATH

      - name: ExifTool (the metadata tests)
        shell: pwsh
        run: choco install exiftool --version=${{ env.EXIFTOOL_VERSION }} -y --no-progress

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: cache
        with:
          # Saved even when a step fails: lint and tests fail often while a change is being fixed, and what they compiled
          # is what the next run needs (the default saves nothing from a failed job).
          cache-on-failure: true
          # The workspace crates too: a change to one crate rebuilds it and its dependents, not the whole workspace.
          cache-workspace-crates: true
          # The build scripts' sources. rust-cache skips the save when its key matches the restored entry, so a build.rs
          # change alone is never saved: every run would rebuild the build script against the old one. Keyed on them, a
          # change starts a new entry, which is built once and saved.
          key: ${{ hashFiles('**/build.rs') }}

      # Diagnostic (temporary): what the restored target/ holds before any build runs. Dev-dependencies (proptest, image,
      # bindgen) and cxx-qt-lib's build output are compiled again by the Tests step on every run, so this shows whether
      # their rlibs and build-script outputs came back from the cache. If they are absent, the saved cache lacks them.
      - name: Restored target (diagnostic)
        shell: pwsh
        run: |
          "cache-hit: ${{ steps.cache.outputs.cache-hit }}"
          foreach ($name in 'proptest', 'image', 'bindgen', 'zeroize', 'cxx_qt_gen', 'pg_desktop') {
            $rlibs = @(Get-ChildItem -Path target/debug/deps -Filter "lib$name-*.rlib" -ErrorAction SilentlyContinue)
            $rmetas = @(Get-ChildItem -Path target/debug/deps -Filter "lib$name-*.rmeta" -ErrorAction SilentlyContinue)
            "lib$name-*: $($rlibs.Count) rlib, $($rmetas.Count) rmeta"
          }
          "deps files: $(@(Get-ChildItem -Path target/debug/deps -File -ErrorAction SilentlyContinue).Count)"
          "fingerprint dirs: $(@(Get-ChildItem -Path target/debug/.fingerprint -Directory -ErrorAction SilentlyContinue).Count)"
          "cxx-qt-lib build dirs: $(@(Get-ChildItem -Path target/debug/build -Directory -Filter 'cxx-qt-lib-*' -ErrorAction SilentlyContinue).Count)"
          "cxx-qt-lib build outputs: $(@(Get-ChildItem -Path target/debug/build -Recurse -Filter output -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -like 'cxx-qt-lib-*' }).Count)"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The screenshot fixture's venv is built from this Python (tools/compare-shots.ps1). The patch is pinned, as the
          # local tools' Python is (3.12.10).
          python-version: "3.12.10"

      - name: Lint (clippy and the docs over the Windows-only code, and the QML)
        # The rest of the lint (formatting, dependencies, Python, Markdown, wasm32) runs once, in the Linux job.
        run: just lint-windows

      - name: Tests (Qt's bin on PATH; PG_REQUIRE_TOOLS makes a missing tool fail the job)
        shell: pwsh
        run: |
          just test
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: QML tests
        run: just qmltest

      - name: Screenshot comparison against the committed reference
        if: github.event_name == 'pull_request'
        continue-on-error: true # informational until it is stable (plan S-15)
        shell: pwsh
        run: |
          # Without -Base, the comparison uses the one reference under tools/shots/reference. A PR's base has none unless
          # someone recorded one, so looking it up failed every run. -Python: the Python 3.12 that setup-python put on PATH.
          just shots -Python python
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Screenshot report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots
          path: |
            target/shots/report.txt
            target/shots/diff/
          if-no-files-found: ignore

      # Diagnostic (temporary): one timeline per cargo --timings run (lint's clippy and doc, the tests, the shots' build),
      # so this comes last. cargo writes each run to its own cargo-timing-<time>.html.
      - name: Cargo timings report (diagnostic)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cargo-timings
          path: target/cargo-timings/
          if-no-files-found: ignore

  linux:
    name: Linux (whole workspace, Qt)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      # The desktop crate's tests run without a display.
      QT_QPA_PLATFORM: offscreen
      # Link with mold (installed in the system step). qt-build-utils picks the linker when the build script runs, and
      # a cached run keeps its choice, so installing mold alone changes nothing: the cache's build script keeps ld.bfd and
      # replays its warning. Setting the flag here changes every unit's fingerprint, so the next run rebuilds once.
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Content key for pg-desktop's build script (a hash of its crate; see crates/desktop/build.rs)
        run: echo "PG_DESKTOP_CONTENT_KEY=${{ hashFiles('crates/desktop/**') }}" >> "$GITHUB_ENV"

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          # Pinned (see the Windows job): `just lint` checks these versions too.
          tool: just@1.59.0,cargo-deny@0.20.2,cargo-machete@0.9.2

      # The apt packages (tools/profiling/apt-packages.txt) and the FFmpeg and libclang links. Not cached: an apt cache
      # restores files without registering them with apt, so apt downloads them again anyway, and the cached step did nothing.
      - name: System packages and libraries (FFmpeg, libclang)
        run: bash tools/profiling/wsl-setup.sh --ci

      - name: Build environment (FFmpeg and libclang, for the steps after this one)
        # Each step runs in its own shell, so an export in one step does not reach the next. GITHUB_ENV carries these
        # to every later step (Clippy and tests, Docs).
        run: |
          echo "FFMPEG_DIR=$HOME/.local/share/pg-bench/ffmpeg" >> "$GITHUB_ENV"
          # pg-video's build script key (crates/video/build.rs): the FFmpeg headers' packages, by name and version. apt installs
          # them fresh on every run, so the folder's mtimes change every run; the key changes only when the packages do.
          echo "PG_VIDEO_CONTENT_KEY=$(dpkg-query -W -f='${Package} ${Version}\n' libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
          LIBCLANG_PATH=$(find /usr/lib -maxdepth 2 -path '/usr/lib/llvm-*/lib' | sort -V | tail -1)
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"

      - name: Qt 6.12.0 (linux_gcc_64, at $RUNNER_TEMP/Qt, as the Windows job's kit)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VERSION }}
          # The same aqtinstall commit as the Windows job (see there for why).
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          arch: linux_gcc_64
          # The action installs to <dir>/Qt/<version>/<arch>: gcc_64 under RUNNER_TEMP.
          dir: ${{ runner.temp }}
          modules: qtmultimedia
          cache: true

      - name: Qt's qmake and libraries (for cxx-qt and the test binaries)
        run: |
          # cxx-qt finds qmake through QMAKE; the test binaries load Qt's libraries from LD_LIBRARY_PATH.
          echo "QMAKE=$RUNNER_TEMP/Qt/6.12.0/gcc_64/bin/qmake" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/Qt/6.12.0/gcc_64/lib" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Saved even when a step fails: lint and tests fail often while a change is being fixed, and what they compiled
          # is what the next run needs (the default saves nothing from a failed job).
          cache-on-failure: true
          # The workspace crates too: a change to one crate rebuilds it and its dependents, not the whole workspace.
          cache-workspace-crates: true
          # As in the Windows job: a build.rs change must start a new entry, or it is never saved (see there).
          key: ${{ hashFiles('**/build.rs') }}

      # The Linux job runs the checks that do not need Windows, once: the Windows job's lint runs only the Windows-only ones.
      # Every cargo command takes --locked: it fails before compiling if Cargo.lock would have to change.
      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy and tests (the whole workspace)
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Docs (warnings are errors, as the Windows job's lint)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --document-private-items --locked

      - name: wasm32 (the shared model and the client stay free of platform code)
        run: cargo check -p pg-model -p pg-client --locked --target wasm32-unknown-unknown

      - name: Lockfiles of the workspaces outside the root (fuzz, eval/jpeg-decoders)
        run: |
          # Each is its own workspace with its own Cargo.lock, and is not built here: this fails when its lock would change.
          cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 >/dev/null
          cargo metadata --locked --manifest-path eval/jpeg-decoders/Cargo.toml --format-version 1 >/dev/null

      - name: Supply chain (licences, advisories, unused dependencies)
        run: |
          cargo deny check
          cargo machete crates

      - name: Python and Markdown
        run: |
          # The versions the Justfile's lint checks for (its ruff_version and markdownlint_version); bump both together.
          python -m pip install --quiet ruff==0.17.3
          ruff format --check .
          ruff check .
          npm install --global markdownlint-cli@0.50.0
          markdownlint "**/*.md"
