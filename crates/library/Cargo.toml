[package]
name = "pg-library"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The job that runs the passes in order (`runner`), how a catalog folder is opened (`open_catalog`, `open_thumbs`,
# `versions`, which names the renderer's `THUMBS_VERSION`), and what both front ends do around the passes (`folders`,
# `scans`). The passes are their own crates (`pg-scan`, `pg-import`, `pg-thumbs`, `pg-borders`, `pg-crop`,
# `pg-writeback`), which callers name directly: this crate re-exports none of them. The runner runs them all, so it
# depends on all of them. The integration tests of `pg-borders` and `pg-crop` are here, because they prepare a catalog
# with `versions`; they and the other tests dev-depend on the codecs they check against.
[dependencies]
pg-analysis = { path = "../analysis" }
pg-borders = { path = "../borders" }
pg-catalog = { path = "../catalog" }
pg-crop = { path = "../crop" }
pg-import = { path = "../import" }
pg-jobs = { path = "../jobs" }
pg-model = { path = "../model" }
pg-platform = { path = "../platform" }
pg-render = { path = "../render" }
pg-scan = { path = "../scan" }
pg-thumbcache = { path = "../thumbcache" }
pg-thumbs = { path = "../thumbs" }
pg-writeback = { path = "../writeback" }
anyhow.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The catalog's test fixture (files as the scanner inserts them).
pg-catalog = { path = "../catalog", features = ["fixture"] }
image.workspace = true
pg-codec = { path = "../codec" }
pg-metadata = { path = "../metadata" }
pg-testkit = { path = "../testkit" }
pg-jobs-testkit = { path = "../jobs-testkit" }
pg-video = { path = "../video" }
# The writer's faults, for the test that a panic in a job doesn't end it.
pg-writeback = { path = "../writeback", features = ["fault"] }
