# CI. Two jobs: `windows` (the app: lint, the module cycles, tests, the QML tests, the screenshot comparison),
# and `linux` (the whole workspace on Linux, with Qt for Linux: the same recipes as the Windows job, lint, the module
# cycles, tests and the QML tests). Both run the Justfile's recipes, so a check that passes here passes there; the steps that are not
# recipes are the setup. The first step of each job (`github_files.py pins`) writes the Justfile's pins to the environment, so
# the Justfile is the one place a version is written. The compiler is pinned in rust-toolchain.toml. Actions are pinned to commit
# SHAs with the tag in the comment; .github/dependabot.yml proposes updates. The Linux packages are in docker/apt-packages.txt.
#
# Inputs from outside the repository, and what each one is pinned to:
#   - Qt (the Justfile's qt_version; msvc2022_64 on Windows), installed by jurplel/install-qt-action under QT_INSTALL_ROOT.
#     The pins step sets PG_QT_DIR to that kit, as a developer's .env does.
#   - FFmpeg 9.0 shared build, GPL (BtbN's month-end autobuild, the Justfile's ffmpeg_url): pinned in the Justfile, which `just setup` fetches and
#     checks against its SHA-256 (GitHub's digest of the release asset). The Windows job runs that recipe.
#   - ExifTool at the Justfile's pins: Chocolatey's package (exiftool_version) on Windows, the release's source archive
#     (exiftool_source_*, tools/install_exiftool.py) on Linux. The rest of the Linux packages are in docker/apt-packages.txt.
#
# The screenshot comparison starts informational (continue-on-error) and becomes required once it is stable.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A panic in a test or a build script prints its backtrace, so a CI failure shows where it came from.
  RUST_BACKTRACE: 1
  # Cargo draws its progress bar only on a terminal; the runner has none, so force it, at a fixed width.
  CARGO_TERM_PROGRESS_WHEN: always
  CARGO_TERM_PROGRESS_WIDTH: "100"
  # Path packages (the workspace and the [patch] path crates) are compared by checksum, not mtime, so a fresh checkout does
  # not rebuild them. The flag alone changes nothing: cargo also needs build.fingerprint = "content". Local builds do not
  # set these. Both are unstable cargo settings, accepted by the pinned nightly (rust-toolchain.toml) without RUSTC_BOOTSTRAP.
  # A build script's rerun-if-changed lines compare mtimes, which a fresh checkout makes new. pg-desktop avoids that with a
  # content key (PG_DESKTOP_CONTENT_KEY, set by the step after the toolchain: a hash of crates/desktop, see its build.rs).
  # pg-video's FFmpeg folder is cached with its archive, so it keeps the old mtimes (the FFmpeg cache step). On Linux, where
  # apt installs the headers on every run, PG_VIDEO_CONTENT_KEY (a hash of the packages, set by the build environment step)
  # does the same job. The flag below
  # covers rustdoc: it uses the dep-info file instead of the newest source mtime.
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
  CARGO_BUILD_FINGERPRINT: "content"
  CARGO_UNSTABLE_RUSTDOC_DEPINFO: "true"
  # A test that needs ExifTool or ffmpeg fails when it is missing, instead of skipping (pg_testkit::require_tool).
  PG_REQUIRE_TOOLS: "1"

jobs:
  windows:
    name: Windows (app, Qt)
    runs-on: windows-2025
    timeout-minutes: 90
    # The steps run under bash (Git for Windows), so a failed command fails its step; the diagnostics below say pwsh.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The pinned Python comes first: the pins step and `just setup` and the other recipes run its scripts (the screenshot
      # fixture's venv is built from it too, tools/compare_shots.py). The patch is pinned, as the local tools' Python is (3.12.10).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"

      # The Justfile's pins, for every later step: QT_VERSION, PG_QT_DIR (the kit the recipes and the desktop crate find qmake
      # in, as a developer's .env sets it), the install-action's tool list and the aqtinstall commit (tools/ci/github_files.py).
      - name: Pins (the Justfile's versions, into the environment)
        run: python tools/ci/github_files.py pins

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show

      # parajpeg (a git dependency) compiles its C++ with clang-cl, which it finds at CLANG_CL, else at the runner's LLVM 20.
      # The runner's Visual Studio STL refuses Clang older than 22, so LLVM 22 is installed beside it (its own folder, the
      # release's installer, checked against the release's SHA-256) and CLANG_CL points at it for every later step.
      - name: clang-cl 22 for parajpeg's C++ (installed beside the runner's LLVM 20)
        shell: pwsh
        env:
          LLVM_VERSION: "22.1.8"
          LLVM_SHA256: "16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c"
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_VERSION-win64.exe"
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.exe" -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $env:LLVM_SHA256) { throw "the LLVM installer is $actual, not the release's $env:LLVM_SHA256" }
          Start-Process -FilePath $installer -ArgumentList '/S', '/D=C:\LLVM22' -Wait
          $clang = 'C:\LLVM22\bin\clang-cl.exe'
          & $clang --version
          if ($LASTEXITCODE -ne 0) { throw "clang-cl did not run at $clang" }
          "CLANG_CL=$clang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          # Pinned in the Justfile: a new release of these can change what the lint reports. `just lint` checks the same versions.
          tool: ${{ env.TAIKI_TOOLS }}

      - name: "Qt ${{ env.QT_VERSION }} (at PG_QT_DIR)"
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VERSION }}
          # aqtinstall's latest release, 3.3.0, cannot install Qt 6.11 or later on Windows x64: Qt split that repository
          # by compiler, and 3.3.0 still looks for the old path (Updates.xml 404, "Failed to locate XML data"). Its master
          # can (issue miurahr/aqtinstall#959). The commit is the Justfile's aqtinstall_commit, the one that installs this Qt.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@${{ env.AQTINSTALL_COMMIT }}
          arch: ${{ env.QT_ARCH }}
          # The action installs to <dir>\Qt\<version>\<arch>: QT_INSTALL_ROOT is the drive root, so PG_QT_DIR is the kit.
          dir: ${{ env.QT_INSTALL_ROOT }}
          modules: qtmultimedia
          cache: true

      - name: Content key for pg-desktop's build script (a hash of its crate; see crates/desktop/build.rs)
        run: python tools/ci/github_files.py env PG_DESKTOP_CONTENT_KEY "${{ hashFiles('crates/desktop/**') }}"

      - name: FFmpeg archive and build (cached; keyed on the pin's SHA-256, which the pins step exports)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # The extracted build too: pg-video's build script reruns when its include folder is newer than its last run, and
          # an extraction on every run made it newer every time. A restore keeps the files' times.
          path: |
            .deps/downloads
            .deps/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_SHA256 }}

      - name: FFmpeg (the pinned shared build, for pg-video and its tests)
        # `just setup` checks the archive against the pin before it unpacks anything, so a mismatch fails here and nothing
        # bad reaches the cache. With the build already there, it does nothing.
        run: |
          just setup
          python tools/ci/github_files.py path .deps/ffmpeg/bin

      - name: ExifTool (the metadata tests)
        run: choco install exiftool --version=${{ env.EXIFTOOL_VERSION }} -y --no-progress

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: cache
        with:
          # Saved even when a step fails: lint and tests fail often while a change is being fixed, and what they compiled
          # is what the next run needs (the default saves nothing from a failed job).
          cache-on-failure: true
          # The workspace crates too: a change to one crate rebuilds it and its dependents, not the whole workspace.
          cache-workspace-crates: true
          # The build scripts' sources. rust-cache skips the save when its key matches the restored entry, so a build.rs
          # change alone is never saved: every run would rebuild the build script against the old one. Keyed on them, a
          # change starts a new entry, which is built once and saved.
          key: ${{ hashFiles('**/build.rs') }}

      # Diagnostic (temporary): what the restored target/ holds before any build runs. Dev-dependencies (proptest, image,
      # bindgen) and cxx-qt-lib's build output are compiled again by the Tests step on every run, so this shows whether
      # their rlibs and build-script outputs came back from the cache. If they are absent, the saved cache lacks them.
      - name: Restored target (diagnostic)
        shell: pwsh
        run: |
          "cache-hit: ${{ steps.cache.outputs.cache-hit }}"
          foreach ($name in 'proptest', 'image', 'bindgen', 'zeroize', 'cxx_qt_gen', 'pg_desktop') {
            $rlibs = @(Get-ChildItem -Path target/debug/deps -Filter "lib$name-*.rlib" -ErrorAction SilentlyContinue)
            $rmetas = @(Get-ChildItem -Path target/debug/deps -Filter "lib$name-*.rmeta" -ErrorAction SilentlyContinue)
            "lib$name-*: $($rlibs.Count) rlib, $($rmetas.Count) rmeta"
          }
          "deps files: $(@(Get-ChildItem -Path target/debug/deps -File -ErrorAction SilentlyContinue).Count)"
          "fingerprint dirs: $(@(Get-ChildItem -Path target/debug/.fingerprint -Directory -ErrorAction SilentlyContinue).Count)"
          "cxx-qt-lib build dirs: $(@(Get-ChildItem -Path target/debug/build -Directory -Filter 'cxx-qt-lib-*' -ErrorAction SilentlyContinue).Count)"
          "cxx-qt-lib build outputs: $(@(Get-ChildItem -Path target/debug/build -Recurse -Filter output -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -like 'cxx-qt-lib-*' }).Count)"

      # The lint tools at their pins (tools/lint, and `just lint-tools-setup`): the same ones the Linux job installs.
      - name: Lint tools (ruff and markdownlint at their pins)
        run: just lint-tools-setup

      - name: Lint (every check, as on Linux, and the QML)
        run: just lint

      - name: "Dependencies (cargo-deny: advisories, licences, sources)"
        # Its own step, outside `just lint`: it fetches the advisory database from GitHub, so it is retried, three times.
        run: |
          for attempt in 1 2 3; do
            if just deny; then exit 0; fi
            echo "cargo-deny failed (attempt $attempt of 3)"
            sleep 30
          done
          exit 1

      - name: Module cycles (the text scan, and the compiler's module graph on the Windows target)
        # The Windows-only modules (the cfg(windows) halves of pg-platform) are in this graph only.
        run: just modgraph

      - name: Tests (Qt's bin on PATH; PG_REQUIRE_TOOLS makes a missing tool fail the job)
        # --no-fail-fast: a red run names every failing test, not the first test binary's (cargo stops at that one otherwise).
        run: just test --no-fail-fast

      - name: QML tests
        run: just qmltest

      - name: Python tools tests (stdlib unittest, tools/test_*.py)
        run: just test-tools

      - name: Eval tools tests (stdlib unittest; the viewer imports Pillow, the bench tests import numpy)
        run: |
          # The Pillow and numpy pins are read from eval/requirements.txt, the one place they are written. The rest of that
          # file is the GPU venv (torch, TensorRT, two extra indexes), which CI does not install.
          python tools/ci/eval_pins.py install
          just test-eval

      - name: Screenshot comparison against the newest committed reference
        if: github.event_name == 'pull_request'
        continue-on-error: true # informational until it is stable
        run: |
          # The comparison uses the newest reference in this commit's history (tools/compare_shots.py). The checkout is
          # shallow, which holds only the merge commit, so the history is fetched first. A pull request's merge commit
          # includes main, so main's reference is found. --python: the Python 3.12 that setup-python put on PATH.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow --quiet; fi
          just shots --python python

      - name: Screenshot report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots
          path: |
            target/shots/report.txt
            target/shots/diff/
          if-no-files-found: ignore

      # Diagnostic (temporary): one timeline per cargo --timings run (lint's clippy and doc, the tests, the shots' build),
      # so this comes last. cargo writes each run to its own cargo-timing-<time>.html.
      - name: Cargo timings report (diagnostic)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cargo-timings
          path: target/cargo-timings/
          if-no-files-found: ignore

  linux:
    name: Linux (whole workspace, Qt)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      # The desktop crate's tests run without a display.
      QT_QPA_PLATFORM: offscreen
      # Link with mold (installed in the system step). qt-build-utils picks the linker when the build script runs, and
      # a cached run keeps its choice, so installing mold alone changes nothing: the cache's build script keeps ld.bfd and
      # replays its warning. Setting the flag here changes every unit's fingerprint, so the next run rebuilds once.
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Justfile's pins, for every later step (see the Windows job). The runner's python3 runs it.
      - name: Pins (the Justfile's versions, into the environment)
        run: python3 tools/ci/github_files.py pins

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Content key for pg-desktop's build script (a hash of its crate; see crates/desktop/build.rs)
        run: python3 tools/ci/github_files.py env PG_DESKTOP_CONTENT_KEY "${{ hashFiles('crates/desktop/**') }}"

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          # Pinned (see the Windows job): `just lint` checks these versions too.
          tool: ${{ env.TAIKI_TOOLS }}

      # The apt packages (docker/apt-packages.txt) and the FFmpeg and libclang links. Not cached: an apt cache
      # restores files without registering them with apt, so apt downloads them again anyway, and the cached step did nothing.
      - name: System packages and libraries (FFmpeg, libclang)
        run: python3 tools/profiling/ci_setup.py

      # ExifTool at the Justfile's pinned release (its source archive, checked by SHA-256), the tests' program on Linux.
      - name: ExifTool (the pinned release, for the metadata tests)
        run: |
          python3 tools/install_exiftool.py --url "$EXIFTOOL_SOURCE_URL" --sha256 "$EXIFTOOL_SOURCE_SHA256" \
            --version "$EXIFTOOL_SOURCE_VERSION" --prefix "$RUNNER_TEMP/exiftool"
          python3 tools/ci/github_files.py path "$RUNNER_TEMP/exiftool"

      - name: Build environment (libclang and the video build's key, for the steps after this one)
        # Each step runs in its own shell, so an export in one step does not reach the next. GITHUB_ENV carries these
        # to every later step (Clippy and tests, Docs). FFmpeg's headers are found by pkg-config (crates/video/build.rs).
        run: |
          # pg-video's build script key (crates/video/build.rs): the FFmpeg headers' packages, by name and version. apt installs
          # them fresh on every run, so the folder's mtimes change every run; the key changes only when the packages do.
          echo "PG_VIDEO_CONTENT_KEY=$(dpkg-query -W -f='${Package} ${Version}\n' libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
          LIBCLANG_PATH=$(find /usr/lib -maxdepth 2 -path '/usr/lib/llvm-*/lib' | sort -V | tail -1)
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"

      # The kit's QMAKE (cxx-qt) and LD_LIBRARY_PATH (the test binaries) are written by the pins step, with PG_QT_DIR.
      - name: Qt (linux, under QT_INSTALL_ROOT, as the Windows job's kit)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VERSION }}
          # The same aqtinstall commit as the Windows job (see there for why).
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@${{ env.AQTINSTALL_COMMIT }}
          arch: ${{ env.QT_ARCH }}
          # The action installs to <dir>/Qt/<version>/<arch>: the kit under RUNNER_TEMP, where PG_QT_DIR is.
          dir: ${{ env.QT_INSTALL_ROOT }}
          modules: qtmultimedia
          cache: true

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Saved even when a step fails: lint and tests fail often while a change is being fixed, and what they compiled
          # is what the next run needs (the default saves nothing from a failed job).
          cache-on-failure: true
          # The workspace crates too: a change to one crate rebuilds it and its dependents, not the whole workspace.
          cache-workspace-crates: true
          # As in the Windows job: a build.rs change must start a new entry, or it is never saved (see there).
          key: ${{ hashFiles('**/build.rs') }}

      # The same recipes as the Windows job. `just lint` runs every check that does not need Windows (formatting, clippy,
      # the wasm32 check, the docs, the lockfiles, the supply chain, the crate boundaries, ruff and markdownlint) and the
      # QML lint; the lint tools come from their lockfiles (`just lint-tools-setup`). Every cargo command takes --locked.
      - name: Lint tools (ruff and markdownlint at their pins)
        run: just lint-tools-setup

      - name: Lint (every check, and the QML)
        run: just lint

      - name: "Dependencies (cargo-deny: advisories, licences, sources)"
        # Its own step, outside `just lint`: it fetches the advisory database from GitHub, so it is retried, three times.
        run: |
          for attempt in 1 2 3; do
            if just deny; then exit 0; fi
            echo "cargo-deny failed (attempt $attempt of 3)"
            sleep 30
          done
          exit 1

      - name: Module cycles (the text scan, and the compiler's module graph on the Linux target)
        # The Unix-only modules (the cfg(unix) halves of pg-platform) are in this graph only.
        run: just modgraph

      - name: Tests (the whole workspace)
        # --no-fail-fast: a red run names every failing test, not the first test binary's (cargo stops at that one otherwise).
        run: just test --no-fail-fast

      # A crash in the QML tests (a SIGSEGV in Qt Multimedia, seen on this job) leaves a core file: the kernel writes it
      # to this folder, set here because this runner's default hands cores to systemd-coredump. The failure steps below
      # read it with gdb and upload it. Nothing runs under gdb on a pass, and the core costs nothing unless there is one.
      - name: Core files for the QML tests (a folder under RUNNER_TEMP)
        run: |
          mkdir -p "$RUNNER_TEMP/cores"
          sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/cores/core.%e.%p"

      - name: QML tests
        id: qml
        run: |
          ulimit -c unlimited
          just qmltest

      - name: QML crash, on a QML failure only (backtrace from the core)
        if: failure() && steps.qml.outcome == 'failure'
        run: |
          command -v gdb > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gdb; }
          shopt -s nullglob
          for core in "$RUNNER_TEMP"/cores/core.qml_host.*; do
            gdb -batch -ex "thread apply all bt 40" target/qml_host/qml_host "$core" || true
            gzip -c "$core" > "$RUNNER_TEMP/$(basename "$core").gz"
          done
          ls -la "$RUNNER_TEMP/cores"

      - name: Upload the QML core, on a QML failure only
        if: failure() && steps.qml.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qml-core-linux
          path: ${{ runner.temp }}/core.qml_host.*.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: Python tools tests (stdlib unittest, tools/test_*.py)
        run: just test-tools
