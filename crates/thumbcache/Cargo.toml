[package]
name = "pg-thumbcache"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The thumbnail cache: one SQLite file of the grid's JPEG thumbnails, keyed by (file, height) and capped in bytes, with
# its writer thread. The storage only: making a thumbnail is `pg-render`'s, and the pass that makes them is the
# library's. It reads the catalog through the catalog's views alone (`thumb_sources`, `thumb_clock`, `thumb_folders`),
# with no dependency on `pg-catalog`; the tests make catalogs with its fixture.
[dependencies]
anyhow.workspace = true
pg-jobs = { path = "../jobs" }
pg-model = { path = "../model" }
pg-platform = { path = "../platform" }
pg-dbfile = { path = "../dbfile" }
rusqlite.workspace = true

[dev-dependencies]
pg-analysis = { path = "../analysis" }
pg-catalog = { path = "../catalog", features = ["fixture"] }
pg-testkit = { path = "../testkit" }
pg-jobs-testkit = { path = "../jobs-testkit" }
