[package]
name = "pg-desktop"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true


[lib]
# The unit tests run with Qt's bin on PATH (`just test` puts it there): a test binary links Qt and runs from
# target/<profile>/build/pg-desktop/<hash>/out under the pinned nightly (target/<profile>/deps with stable), where the Qt DLLs
# aren't, so without that PATH it fails with STATUS_DLL_NOT_FOUND.
doctest = false

[dependencies]
# Not here: catalog, library, jobs, thumbcache, yandex and codec. The window reaches them through `pg-app`'s typed
# methods, and takes the plain data they hand out from `pg-model`, so `cargo deny` and machete see the boundary.
pg-client = { path = "../client" }
pg-log = { path = "../log" }
pg-perf = { path = "../perf" }
pg-model = { path = "../model" }
pg-platform = { path = "../platform" }
pg-trace = { path = "../trace" }
pg-wording = { path = "../wording" }
pg-app = { path = "../app" }
pg-render = { path = "../render" }
anyhow.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
cxx-qt-lib.features = ["qt_gui", "qt_qml"]
serde_json.workspace = true

[dev-dependencies]
# The tests' names that are no UTF-8 (`odd_name`), and the test folders (`run_folder`).
pg-testkit = { path = "../testkit" }
pg-platform = { path = "../platform", features = ["testing"] }

[build-dependencies]
cxx-qt-build.workspace = true
