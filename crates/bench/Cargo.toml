[package]
name = "pg-bench"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The callgrind benches (benches/ir.rs): gungraun runs them under Valgrind, which is Linux-only (docs/PROFILING.md),
# so the benches are built there only; elsewhere the target's `main` prints where to run them.
[dependencies]
pg-analysis = { path = "../analysis" }
pg-catalog = { path = "../catalog" }
pg-thumbcache = { path = "../thumbcache" }
pg-render = { path = "../render" }
pg-model = { path = "../model" }
pg-platform = { path = "../platform" }
rusqlite.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gungraun.workspace = true

[[bench]]
name = "ir"
harness = false
