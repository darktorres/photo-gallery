[package]
name = "pg-thumbs"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The thumbnail pass: makes the cached thumbnails of the analyzed files. Depends on the render and the thumbnail cache, not on the analysis or the writes.
[features]
# The tests of the crates above ask the cache to refuse its stores (`fault`).
fault = []

[dependencies]
pg-catalog = { path = "../catalog" }
pg-jobs = { path = "../jobs" }
pg-model = { path = "../model" }
pg-perf = { path = "../perf" }
pg-platform = { path = "../platform" }
pg-render = { path = "../render" }
pg-thumbcache = { path = "../thumbcache" }
anyhow.workspace = true
# The fault module's trigger on the cache's file (`fault`, and the tests).
rusqlite.workspace = true

[dev-dependencies]
# The catalog's test fixture (files as the scanner inserts them).
pg-catalog = { path = "../catalog", features = ["fixture"] }
pg-analysis = { path = "../analysis" }
pg-import = { path = "../import" }
pg-scan = { path = "../scan" }
pg-testkit = { path = "../testkit" }
pg-jobs-testkit = { path = "../jobs-testkit" }
