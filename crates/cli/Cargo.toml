[package]
name = "pg-cli"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
pg-library = { path = "../library" }
pg-borders = { path = "../borders" }
pg-dedup = { path = "../dedup" }
pg-import = { path = "../import" }
pg-scan = { path = "../scan" }
pg-thumbs = { path = "../thumbs" }
pg-writeback = { path = "../writeback" }
pg-catalog = { path = "../catalog" }
pg-thumbcache = { path = "../thumbcache" }
pg-model = { path = "../model" }
pg-client = { path = "../client" }
pg-analysis = { path = "../analysis" }
pg-codec = { path = "../codec" }
pg-jobs = { path = "../jobs" }
pg-platform = { path = "../platform" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The catalog's test fixture (files as the scanner inserts them).
pg-catalog = { path = "../catalog", features = ["fixture"] }
pg-testkit = { path = "../testkit" }
pg-jobs-testkit = { path = "../jobs-testkit" }
# The writer's faults, for the test that `gallery write` returns when the writer ends.
pg-writeback = { path = "../writeback", features = ["fault"] }
