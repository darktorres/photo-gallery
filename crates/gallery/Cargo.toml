[package]
name = "pg-gallery"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "gallery"
path = "src/main.rs"
# No unit tests here: a test binary would link Qt through the app and run from its build folder (target/<profile>/build/
# pg-gallery/<hash>/out under the pinned nightly), where the Qt DLLs aren't, and fail with STATUS_DLL_NOT_FOUND.
test = false

[dependencies]
pg-cli = { path = "../cli" }
# The app window. Without it `gallery` runs only its commands, and builds without Qt.
pg-desktop = { path = "../desktop", optional = true }
# The heap profiler (docs/PROFILING.md "Tool: dhat"): a patched dhat-rs that takes whole backtraces quickly
# (vendor/README.md).
dhat = { workspace = true, optional = true }

[features]
default = ["desktop"]
desktop = ["dep:pg-desktop"]
# `gallery` with dhat as its allocator, writing dhat-heap.json when it ends. Built with the `dhat` profile.
dhat-heap = ["dep:dhat"]

[target.'cfg(windows)'.dependencies]
# The console attach (src/main.rs), which only Windows has.
windows-sys.workspace = true

[build-dependencies]
winres.workspace = true
