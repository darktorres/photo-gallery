# The Rust toolchain. rustup reads this file, so a build here, in CI (.github/workflows/ci.yml) and in WSL uses the same
# compiler. Change the channel on purpose: a new stable can add a clippy lint, and CI's clippy runs with -D warnings.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
