# The shared model stays free of platform code, so the web client can build it (S-15): no clock, no threads, no files.
# The wasm32 check proves it builds; these rules stop a host-only call from creeping in unnoticed.
disallowed-types = [
    { path = "std::time::Instant", reason = "no clock in the shared model: time is an input (now_ms)" },
    { path = "std::time::SystemTime", reason = "no clock in the shared model: time is an input (now_ms)" },
]
disallowed-methods = [
    { path = "std::thread::spawn", reason = "no threads in the shared model" },
    { path = "std::fs::read", reason = "no files in the shared model" },
    { path = "std::fs::read_to_string", reason = "no files in the shared model" },
    { path = "std::fs::write", reason = "no files in the shared model" },
    { path = "std::fs::read_dir", reason = "no files in the shared model" },
]
