# `cargo deny check` (just lint): advisories, licenses, duplicate versions and where crates come from.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Test-only: pdqhash 0.1.1 (the latest), the reference PDQ pg-analysis's tests compare against, pulls in image 0.23.
    { id = "RUSTSEC-2025-0056", reason = "adler, unmaintained; dev-dependency only, via pdqhash 0.1.1 (latest)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# What the dependencies use today; a new license is a decision, not an accident.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # libloading, pg-video's run-time loader of FFmpeg (and bindgen's, in its build script).
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "WTFPL",
    "Zlib",
]

# Our own crates are `publish = false` and carry no license field.
[licenses.private]
ignore = true

[bans]
# Reported, not fatal: most come from pdqhash's old image 0.23 (test-only) and cxx-qt's build tools.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# The libraries have no UI dependency (PLAN §7): Qt and its bindings come in through pg-desktop only.
deny = [
    { crate = "cxx-qt", wrappers = ["pg-desktop", "cxx-qt-lib"] },
    { crate = "cxx-qt-lib", wrappers = ["pg-desktop"] },
    # The file metadata (pg-metadata) is the only XML parser.
    # miniz_oxide and crc32fast aren't banned: png, tiff and flate2 depend on them too.
    { crate = "quick-xml", wrappers = ["pg-metadata"] },
    # The image decoders and encoders are pg-codec's, and the test fixtures' (pg-testkit). `image` is the door to the
    # rest, so its parents are these crates. pg-library's tests write image fixtures (a dev-dependency).
    { crate = "image", wrappers = ["pg-codec", "pg-testkit", "pg-library", "pdqhash"] },
    { crate = "turbojpeg", wrappers = ["pg-codec", "pg-edit", "pg-render"] },
    { crate = "png", wrappers = ["pg-codec", "pg-testkit", "pg-edit", "image"] },
    { crate = "gif", wrappers = ["pg-codec", "image"] },
    { crate = "image-webp", wrappers = ["pg-codec", "pg-edit", "image"] },
    { crate = "tiff", wrappers = ["pg-codec", "image"] },
    { crate = "zune-jpeg", wrappers = ["pg-codec", "image", "tiff"] },
    { crate = "zune-core", wrappers = ["pg-codec", "image", "zune-jpeg"] },
    # pdqhash is the reference PDQ, for pg-analysis's tests only (and it brings its own image 0.23).
    { crate = "pdqhash", wrappers = ["pg-analysis"] },
    # SQLite is pg-catalog's and the thumbnail cache's, pg-schema's (the shared schema check), and pg-bench's (the catalog
    # benches).
    { crate = "rusqlite", wrappers = ["pg-catalog", "pg-query", "pg-schema", "pg-thumbcache", "pg-bench"] },
    # ureq (the HTTP client) is pg-yandex's alone: the search and the downloads.
    { crate = "ureq", wrappers = ["pg-yandex"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The patched crates, pinned by rev from our forks (vendor/README.md). Each fork is ours, carrying the upstream's code.
allow-git = [
    "https://github.com/darktorres/fast_image_resize",
    "https://github.com/darktorres/fdeflate",
    "https://github.com/darktorres/image-gif",
    "https://github.com/darktorres/image-webp",
    "https://github.com/darktorres/image-png",
    "https://github.com/darktorres/cxx-qt",
    "https://github.com/darktorres/quick-xml",
    "https://github.com/darktorres/rusqlite",
    "https://github.com/darktorres/thumbhash",
    "https://github.com/darktorres/image-tiff",
    "https://github.com/darktorres/rust-turbojpeg",
    "https://github.com/darktorres/zune-image",
    "https://github.com/darktorres/dhat-rs",
]
