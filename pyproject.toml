# The repository's Python environments, managed by uv (`uv sync --group <name>`, `uv run`). The Rust and Qt side is not here:
# it is built by cargo, and its native kits (Qt, FFmpeg, CUDA) are pinned in the Justfile.
[project]
name = "photo-gallery"
version = "0.0.0"
requires-python = "==3.12.*"

[tool.uv]
# A set of scripts and tools, not an installable package.
package = false
# What `uv sync` and `uv run` install by default. The GPU groups (eval, jpeg-decoders) are added with `--group` when needed:
# a `uv run` without them removes them from the environment.
default-groups = ["tools", "lint"]
# The lock covers the platforms the scripts run on: Windows (this machine) and Linux (the container and CI).
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
# The eval stack and the ModelOpt quantization pin onnxruntime-gpu differently (1.31.1 for eval, 1.22.0 for ModelOpt 0.48.0
# on Windows), so they are locked as separate resolutions. Each is installed into its own environment.
conflicts = [
    [{ group = "eval" }, { group = "quant" }],
]

# The PyTorch CUDA wheels and the NVIDIA TensorRT wheels come from their own indexes. Each is `explicit`, so only the
# packages assigned to it below are looked up there; everything else resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu134" }
torchvision = { index = "pytorch-cu134" }
tensorrt_cu13 = { index = "nvidia" }
tensorrt_cu13_bindings = { index = "nvidia" }
tensorrt_cu13_libs = { index = "nvidia" }

[dependency-groups]
# The test and tool scripts (tools/shots, tools/profiling). Standard-library unittest needs nothing more.
tools = [
    "numpy==2.5.5",
    "pillow==13.0.0",
]
# The lint's Python tools, at CI's pins (uv.lock holds their hashes).
lint = [
    "pyflakes==4.1.0",
    "ruff==0.17.6",
]
# The eval image's Python packages (docker/Dockerfile, the eval stage): the ANN worker's numpy, FAISS and USearch, and Pillow
# for the JPEG encoder comparison. The same pins as the eval group, which is the Windows GPU stack.
eval-linux = [
    "faiss-cpu==1.16.0",
    "numpy==2.5.5",
    "pillow==13.0.0",
    "usearch==2.26.6",
]
# The ONNX quantization of eval/accel.py (NVIDIA ModelOpt, int8 Q/DQ). Its own environment: see `conflicts` above.
quant = [
    "nvidia-modelopt[onnx]==0.48.0",
]
# The JPEG decoder harness (nvImageCodec and its nvJPEG wheel): its own environment, `just jpeg-env`.
jpeg-decoders = [
    "numpy==2.5.5",
    "nvidia-libnvcomp-cu13==6.0.0.12",
    "nvidia-nvimgcodec-cu13==0.10.1.12",
    "nvidia-nvjpeg==13.3.2.43",
    "nvidia-nvjpeg2k-cu13==0.12.0.58",
    "nvidia-nvtiff-cu13==0.9.0.86",
    "pillow==13.0.0",
]
# The GPU eval stack: torch, TensorRT, and the rest of the model and image libraries. Its environment: `just eval-env`.
eval = [
    "annotated-doc==0.0.7",
    "anyio==4.16.0",
