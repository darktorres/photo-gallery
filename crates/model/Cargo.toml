[package]
name = "pg-model"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The domain data: pure and WASM-safe (no file, catalog, decoder or platform calls), so the web client can share it.
[dependencies]
arrayvec.workspace = true
# The content hash (`analysis::FileHash`): pure Rust, and it builds for wasm32.
blake3.workspace = true
serde.workspace = true
strum.workspace = true
# The TypeScript types for the web client: the wire types of `query` derive `specta::Type` behind this feature.
specta = { workspace = true, optional = true }

[features]
specta = ["dep:specta"]

# The laws of the pure types (tests/laws.rs), checked over generated inputs.
[dev-dependencies]
pg-testrng = { path = "../testrng" }
proptest.workspace = true
serde_json.workspace = true
