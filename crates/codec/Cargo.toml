[package]
name = "pg-codec"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The pixels in and out: the image decoders and encoders are linked here, and deny.toml names the other crates allowed
# to depend on them (`image`, `turbojpeg` and `png` are listed with their wrappers there). No file or
# catalog access; the caller gives the bytes.
[dependencies]
pg-model = { path = "../model" }
anyhow.workspace = true
fast_image_resize.workspace = true
gif.workspace = true
image.workspace = true
image-webp.workspace = true
parajpeg.workspace = true
png.workspace = true
tiff.workspace = true
turbojpeg.workspace = true
webp.workspace = true
zune-core.workspace = true
zune-jpeg.workspace = true

[features]
# The test fixtures for the crates that test their files (`fixtures`).
fixtures = []

[dev-dependencies]
pg-container = { path = "../container" } # a PNG chunk with its CRC, for the decode tests
miniz_oxide.workspace = true
pg-testkit = { path = "../testkit" }
