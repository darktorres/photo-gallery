[package]
name = "pg-testkit"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Test helpers only (a dev-dependency of the crates that have tests). Its folders and their protocol are pg-platform's
# `testing` module (the platform code is there, so this crate has none), which a test names there. Its one dependency
# besides the platform is `thiserror`, for the error the helpers return: the image fixtures are pg-codec's
# (`pg_codec::fixtures`, which needs the encoders). The job layer's helpers are `pg-jobs-testkit`.
[dependencies]
pg-platform = { path = "../platform", features = ["testing"] }
thiserror.workspace = true
